<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GitHubFORSHOW</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, "Microsoft JhengHei", sans-serif;
        color: #202124;
        background: #f6f8fa;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(680px, calc(100% - 32px));
        background: #ffffff;
        border: 1px solid #d0d7de;
        border-radius: 8px;
        padding: 40px;
        box-sizing: border-box;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(2rem, 8vw, 4rem);
        line-height: 1;
      }

      p {
        margin: 0;
        font-size: 1.125rem;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>GitHubFORSHOW</h1>
      <p>這是從本機資料夾上傳到 GitHub，並準備使用 GitHub Pages 發布的首頁。</p>
    </main>
  </body>
</html>
